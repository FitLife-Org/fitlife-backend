server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/fitlife_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root123

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: sandbox.smtp.mailtrap.io
    port: 2525
    username: your_mail_username
    password: your_mail_password

fitlife:
  mail:
    from: no-reply@fitlife.local

  ai:
    gemini:
      enabled: false
      api-key: your_gemini_api_key
      model: gemini-3.5-flash
      base-url: https://generativelanguage.googleapis.com/v1beta
      temperature: 0.4
      max-output-tokens: 4096

cloudinary:
  cloud-name: your_cloudinary_cloud_name
  api-key: your_cloudinary_api_key
  api-secret: your_cloudinary_api_secret

google:
  enabled: false
  client-id: your_google_client_id

vnpay:
  enabled: false

application:
  security:
    jwt:
      secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWYwMTIzNDU2Nzg5YWJjZGVmMDEyMzQ1Njc4OWFiY2RlZg==
      expiration-ms: 1800000