server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: fitlife-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:demo}
    password: ${MAIL_PASSWORD:demo}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fitlife_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL}
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL}

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

swagger-ui:
  path: /swagger-ui.html
  operations-sorter: method
  tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

gemini:
  enabled: ${GEMINI_ENABLED}
  api-key: ${GEMINI_API_KEY}
  api-url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent}

vnpay:
  enabled: ${VNPAY_ENABLED}





google:
  enabled: ${GOOGLE_ENABLED}
  client-id: ${GOOGLE_CLIENT_ID}

application:
  security:
    jwt:
      secret: ${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWYwMTIzNDU2Nzg5YWJjZGVmMDEyMzQ1Njc4OWFiY2RlZg==}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}